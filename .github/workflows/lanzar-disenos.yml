name: Lanzar agente de diseño

# Se dispara cuando /disenar sube un encargo nuevo a output/AAAA-MM/encargos-para-graficas.txt
# (o a mano). Este workflow no genera imágenes ni usa Magnific: solo avisa a la rutina
# "agente-diseno" de la cuenta de Claude del compañero (API trigger de Routines), que es quien
# tiene el conector y los créditos. Es la misma mecánica que lanzar-graficas.yml, pero con una
# rutina propia que tiene este repo como fuente y ejecuta /generar-disenos.
#
# Secretos necesarios (Settings > Secrets and variables > Actions):
#   DISENO_ROUTINE_ID     identificador de la rutina agente-diseno (trig_...)
#   DISENO_ROUTINE_TOKEN  token del disparo por API (se muestra una sola vez al crearlo)
on:
  push:
    branches: [main]
    paths:
      - "output/**/encargos-para-graficas.txt"
  workflow_dispatch:
    inputs:
      mes:
        description: "Mes del encargo (AAAA-MM), p. ej. 2026-10"
        required: true

jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar secretos
        env:
          ROUTINE_ID: ${{ secrets.DISENO_ROUTINE_ID }}
          ROUTINE_TOKEN: ${{ secrets.DISENO_ROUTINE_TOKEN }}
        run: |
          if [ -z "$ROUTINE_ID" ] || [ -z "$ROUTINE_TOKEN" ]; then
            echo "::error::Faltan los secretos DISENO_ROUTINE_ID y/o DISENO_ROUTINE_TOKEN. Los crea el dueño de la rutina agente-diseno (claude.ai/code/routines > Add another trigger > API). Ver docs/disenos-rutina.md."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determinar el mes
        id: mes
        env:
          MES_MANUAL: ${{ github.event.inputs.mes }}
        run: |
          if [ -n "$MES_MANUAL" ]; then
            MES="$MES_MANUAL"
          else
            FILE=$(git diff --name-only HEAD~1 HEAD -- 'output/*/encargos-para-graficas.txt' | head -n1)
            MES=$(echo "$FILE" | sed -E 's#output/([^/]+)/encargos-para-graficas\.txt#\1#')
          fi
          if ! echo "$MES" | grep -qE '^[0-9]{4}-[0-9]{2}$'; then
            echo "::error::No se pudo determinar el mes (valor: '$MES')."
            exit 1
          fi
          if [ ! -f "output/$MES/encargos-para-graficas.txt" ]; then
            echo "::error::No existe output/$MES/encargos-para-graficas.txt"
            exit 1
          fi
          echo "mes=$MES" >> "$GITHUB_OUTPUT"

      - name: Disparar la rutina agente-diseno
        env:
          ROUTINE_ID: ${{ secrets.DISENO_ROUTINE_ID }}
          ROUTINE_TOKEN: ${{ secrets.DISENO_ROUTINE_TOKEN }}
          MES: ${{ steps.mes.outputs.mes }}
          REPO: ${{ github.repository }}
        run: |
          # Limpieza: el ID debe tener la forma trig_XXXX (se acepta pegado dentro de la URL
          # completa) y el token no puede llevar espacios ni saltos de línea.
          RAW_LEN=${#ROUTINE_ID}
          ROUTINE_ID=$(printf '%s' "$ROUTINE_ID" | grep -oE 'trig_[A-Za-z0-9]+' | head -n1)
          ROUTINE_TOKEN=$(printf '%s' "$ROUTINE_TOKEN" | tr -d '[:space:]')
          if [ -z "$ROUTINE_ID" ]; then
            echo "::error::DISENO_ROUTINE_ID no contiene un identificador con la forma trig_XXXX (el valor guardado mide $RAW_LEN caracteres). Cópialo del campo URL del disparo API de la rutina: .../routines/trig_XXXX/fire"
            exit 1
          fi
          echo "ID de rutina con formato correcto (${#ROUTINE_ID} caracteres); token de ${#ROUTINE_TOKEN} caracteres."
          BODY=$(jq -n --arg mes "$MES" --arg repo "$REPO" \
            '{text: ({tipo:"disenos", mes:$mes, repo:$repo, txt:("output/"+$mes+"/encargos-para-graficas.txt"), csv:("output/"+$mes+"/disenos.csv")} | tojson)}')
          RESP=$(curl -sS -w "\n%{http_code}" -X POST \
            "https://api.anthropic.com/v1/claude_code/routines/${ROUTINE_ID}/fire" \
            -H "Authorization: Bearer ${ROUTINE_TOKEN}" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          CODE=$(echo "$RESP" | tail -n1)
          echo "$RESP" | sed '$d'
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            echo "::error::La API de rutinas devolvió HTTP $CODE"
            exit 1
          fi
          echo "Rutina disparada para el mes $MES"
